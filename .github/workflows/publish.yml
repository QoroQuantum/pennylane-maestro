name: Publish to PyPI

on:
  push:
    tags: ["v*"]      # Pushing a version tag, e.g. v0.5.0, releases it
  workflow_dispatch:  # Manual run from the Actions tab (publishes only; no GitHub release unless run on a tag)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check tag matches package version
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PKG_VERSION}"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: pip install build

    - name: Build package
      run: python -m build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create the release
    steps:
    - uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Extract release notes from CHANGELOG.md
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        awk -v v="$VERSION" '
          index($0, "## [" v "]") == 1 { found = 1; next }
          /^## \[/ || /^\[[^]]+\]: /   { found = 0 }
          found
        ' CHANGELOG.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "::warning::No CHANGELOG.md section found for ${VERSION}; falling back to generated notes"
          rm release_notes.md
        fi

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          echo "Release $GITHUB_REF_NAME already exists; attaching build artifacts only"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        elif [ -f release_notes.md ]; then
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release_notes.md
        else
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
        fi
