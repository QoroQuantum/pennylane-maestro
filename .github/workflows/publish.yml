name: Publish to PyPI

# Publishing a GitHub release builds, tests and uploads that version through PyPI
# trusted publishing (no API token is stored in the repository). Run it by hand
# from the Actions tab to publish the current commit, or untick "publish" for a
# dry run that builds and verifies everything but uploads nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: "Skip the CI tests (tests.yml)"
        type: boolean
        default: false
      publish:
        description: "Upload to PyPI and create the GitHub release (untick for a dry run)"
        type: boolean
        default: true

# Dry runs cancel each other; publishing runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && 'publish' || 'dry' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}

jobs:
  # The tests run alongside the build and must pass before upload (unless skipped).
  ci:
    name: Run CI tests
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/tests.yml

  # Single source of the version being published, for both triggers: a release
  # whose tag disagrees with pyproject.toml fails here, before anything builds.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match pyproject.toml version $tag"
            exit 1
          fi

  build:
    name: Build and verify distributions
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Verify the sdist and wheel
        run: python scripts/verify_dist.py dist/ --run-tests

      - uses: actions/upload-artifact@v7
        with:
          name: pennylane-maestro-dist
          path: dist/

  upload_pypi:
    name: Upload to PyPI
    needs: [ci, build]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.publish) && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pennylane-maestro
    permissions:
      id-token: write  # Trusted publishing.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pennylane-maestro-dist
          path: dist/

      - name: Publish package distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # Every published version ends up with a release for it. Under the release
  # trigger one already exists and this is a no-op; a manual dispatch would
  # otherwise leave PyPI ahead of the GitHub release log.
  # GITHUB_TOKEN deliberately: releases it creates do not trigger workflows,
  # so this cannot re-enter the publish flow.
  github_release:
    name: Ensure GitHub release exists
    needs: [version, upload_pypi]
    if: always() && !cancelled() && needs.version.result == 'success' && needs.upload_pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Creates the release.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pennylane-maestro-dist
          path: dist/

      - name: Create release for the published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release; nothing to do."
            exit 0
          fi
          # Release notes from the version's section of CHANGELOG.md, if it has one.
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ || /^\[[^]]+\]: /   { found = 0 }
            found
          ' CHANGELOG.md > release_notes.md
          if [ -s release_notes.md ]; then
            notes=(--notes-file release_notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" "${notes[@]}"
