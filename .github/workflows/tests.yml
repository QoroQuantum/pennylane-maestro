name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
        
    - name: Install dependencies
      run: |
        uv pip install --system pytest pytest-cov
        uv pip install --system -e .
        
    - name: Run tests
      run: |
        pytest tests/ -v --cov=pennylane_maestro --cov-report=xml

  test-qoro:
    # backend="qoro" / Divi runners; Divi needs Python 3.11+.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Install dependencies
      run: |
        uv pip install --system pytest
        uv pip install --system -e ".[cloud]"

    - name: Run Divi backend tests
      run: |
        pytest tests/test_divi_backend.py -v
