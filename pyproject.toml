[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pennylane-maestro"
version = "0.7.1"
description = "PennyLane plugin for the Maestro quantum simulator by Qoro Quantum"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [{name = "Qoro Quantum", email = "team@qoroquantum.de"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pennylane>=0.38",
    "qoro-maestro>=0.3.8",
    "numpy",
]

[project.optional-dependencies]
# backend="qoro": run circuits on the Qoro cloud through Divi
# (0.16 adds QoroService.submit_vjp, used for adjoint gradients).
cloud = ["qoro-divi[pennylane]>=0.16; python_version >= '3.11'"]
# Builds the documentation in docs/.
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
]

[project.urls]
Homepage = "https://github.com/QoroQuantum/pennylane-maestro"
Documentation = "https://qoroquantum.github.io/pennylane-maestro/"
Repository = "https://github.com/QoroQuantum/pennylane-maestro"
Issues = "https://github.com/QoroQuantum/pennylane-maestro/issues"

[project.entry-points."pennylane.plugins"]
"maestro.qubit" = "pennylane_maestro:MaestroQubitDevice"

[tool.setuptools.packages.find]
include = ["pennylane_maestro*"]

[tool.setuptools.package-data]
pennylane_maestro = ["config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

