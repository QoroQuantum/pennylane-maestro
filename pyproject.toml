[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pennylane-maestro"
version = "0.6.0"
description = "PennyLane plugin for the Maestro quantum simulator by Qoro Quantum"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [{name = "Qoro Quantum", email = "team@qoroquantum.de"}]
dependencies = [
    "pennylane>=0.38",
    "qoro-maestro>=0.3.8",
    "numpy",
]

[project.optional-dependencies]
# backend="qoro": run circuits on the QoroService cloud through Divi. Divi
# 0.16 adds QoroService.submit_vjp and allows qoro-maestro >= 0.3.8.
cloud = ["qoro-divi[pennylane]>=0.16; python_version >= '3.11'"]

[project.urls]
Homepage = "https://github.com/QoroQuantum/pennylane-maestro"
Repository = "https://github.com/QoroQuantum/pennylane-maestro"
Issues = "https://github.com/QoroQuantum/pennylane-maestro/issues"

[project.entry-points."pennylane.plugins"]
"maestro.qubit" = "pennylane_maestro:MaestroQubitDevice"

[tool.setuptools.packages.find]
include = ["pennylane_maestro*"]

[tool.setuptools.package-data]
pennylane_maestro = ["config.toml"]

[tool.uv]
# Until Divi 0.16 is released, lock the [cloud] extra against its nightly
# builds (uv only; the published requirement stays >=0.16). Remove then.
override-dependencies = ["qoro-divi[pennylane]>=0.16.0.dev0; python_version >= '3.11'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

